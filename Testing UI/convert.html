<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Lottie to GIF Converter</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Lottie Web & Gifshot CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.5);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Preview Display Grid */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .preview-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .preview-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .canvas-container {
            width: 240px;
            height: 280px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
        }

        .gif-preview {
            width: 240px;
            height: 280px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
            overflow: hidden;
        }

        .gif-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Controls & Status */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .config-label {
            color: var(--text-muted);
        }

        .config-value {
            font-weight: 600;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 1.5rem;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .status-container {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 500;
            min-height: 24px;
        }

        .status-loading {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .status-success {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Luna Vector Exporter</h1>
    <div class="subtitle">Lottie JSON to Smartwatch GIF conversion pipeline</div>

    <div class="preview-grid">
        <div class="preview-box">
            <div class="preview-title">Lottie Canvas Render</div>
            <div class="canvas-container">
                <canvas id="conversion-canvas" width="240" height="280"></canvas>
            </div>
        </div>
        
        <div class="preview-box">
            <div class="preview-title">Generated GIF</div>
            <div class="gif-preview" id="gif-preview-container">
                Preview will appear here
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="config-row">
            <span class="config-label">Target Resolution</span>
            <span class="config-value">240 x 280 (ST7789)</span>
        </div>
        <div class="config-row">
            <span class="config-label">Background Color</span>
            <span class="config-value" style="color: #60a5fa;">#000000 (OLED Black)</span>
        </div>
        <div class="config-row">
            <span class="config-label">Frame Rate</span>
            <span class="config-value">30 FPS (33ms delay)</span>
        </div>
        <div class="config-row">
            <span class="config-label">Source Asset</span>
            <span class="config-value">Untitled file.json</span>
        </div>
    </div>

    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="status-container" id="status">
        Ready to convert.
    </div>

    <button class="btn" id="start-btn" onclick="startConversion()">Start Conversion</button>
</div>

<script>
    async function startConversion() {
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const gifContainer = document.getElementById('gif-preview-container');

        startBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        gifContainer.innerHTML = 'Converting...';

        try {
            statusDiv.innerHTML = '<span class="status-loading">Fetching Lottie animation JSON...</span>';
            const response = await fetch('Untitled file.json');
            if (!response.ok) {
                throw new Error("Could not fetch Untitled file.json. Make sure the server is serving files from the correct folder.");
            }
            const lottieJson = await response.json();

            statusDiv.innerHTML = '<span class="status-loading">Initializing Lottie Canvas Renderer...</span>';
            const canvas = document.getElementById('conversion-canvas');
            const ctx = canvas.getContext('2d');

            // Force Lottie web to load
            const anim = lottie.loadAnimation({
                renderer: 'canvas',
                loop: false,
                autoplay: false,
                animationData: lottieJson,
                rendererSettings: {
                    context: ctx,
                    clearCanvas: true,
                    preserveAspectRatio: 'xMidYMid meet'
                }
            });

            // Wait for Lottie DOM to load completely
            await new Promise((resolve) => {
                if (anim.isLoaded) {
                    resolve();
                } else {
                    anim.addEventListener('DOMLoaded', resolve);
                }
            });

            const totalFrames = anim.totalFrames;
            const images = [];
            const bgColor = '#000000'; // Black background for the watch UI

            console.log("Total Frames to Render:", totalFrames);

            // Loop and draw frame by frame synchronously
            for (let i = 0; i < totalFrames; i++) {
                // Clear the canvas to solid black
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Render Lottie frame
                anim.goToAndStop(i, true);

                // Capture Frame Data URL
                const dataUrl = canvas.toDataURL('image/png');
                images.push(dataUrl);

                // Update Progress Bar
                const progressPct = ((i + 1) / totalFrames) * 50; // Rendering is first 50%
                progressBar.style.width = `${progressPct}%`;
                statusDiv.innerHTML = `<span class="status-loading">Rendering frame ${i + 1} of ${totalFrames}...</span>`;

                // Give a tiny break to let the browser repaint
                await new Promise(r => setTimeout(r, 5));
            }

            statusDiv.innerHTML = '<span class="status-loading">Encoding frames into high-quality GIF...</span>';
            
            // Build GIF using gifshot
            gifshot.createGIF({
                images: images,
                gifWidth: 240,
                gifHeight: 280,
                interval: 1 / 30, // 30 FPS
                numWorkers: 2,
                sampleInterval: 5, // Lower is higher quality (1-30)
                progressCallback: function(captureProgress) {
                    // Update progress from 50% to 90% based on encoding progress
                    const encodingPct = 50 + (captureProgress * 40);
                    progressBar.style.width = `${encodingPct}%`;
                    statusDiv.innerHTML = `<span class="status-loading">Encoding GIF: ${Math.round(captureProgress * 100)}%</span>`;
                }
            }, async function(obj) {
                if (obj.error) {
                    statusDiv.innerHTML = `<span style="color: #ef4444;">GIF Encoding Error: ${obj.error}</span>`;
                    startBtn.disabled = false;
                    return;
                }

                statusDiv.innerHTML = '<span class="status-loading">Uploading GIF to server...</span>';
                progressBar.style.width = '95%';

                try {
                    // Post the final base64 string to python server
                    const saveResponse = await fetch('/save', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ gif: obj.image })
                    });

                    const saveResult = await saveResponse.json();
                    if (saveResult.status === 'success') {
                        progressBar.style.width = '100%';
                        statusDiv.innerHTML = '<span class="status-success">Conversion successful! GIF saved successfully.</span>';
                        
                        // Show the final GIF in preview
                        const img = document.createElement('img');
                        img.src = obj.image;
                        gifContainer.innerHTML = '';
                        gifContainer.appendChild(img);
                    } else {
                        statusDiv.innerHTML = `<span style="color: #ef4444;">Server error: ${saveResult.message}</span>`;
                    }
                } catch (e) {
                    statusDiv.innerHTML = `<span style="color: #ef4444;">Upload failed: ${e.message}</span>`;
                }
                startBtn.disabled = false;
            });

        } catch (error) {
            statusDiv.innerHTML = `<span style="color: #ef4444;">Error: ${error.message}</span>`;
            startBtn.disabled = false;
        }
    }
</script>

</body>
</html>
